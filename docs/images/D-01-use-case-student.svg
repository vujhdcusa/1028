<text x="685.0" y="299.0" font-size="15" text-anchor="middle" fill="#4B5563">（六類資料，含學校的獎懲記錄與電子證書）</text>
<path d="M282,690.0 L436,363.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
