<text x="685.0" y="617.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">查看缺件清單</text>
<text x="685.0" y="643.0" font-size="15" text-anchor="middle" fill="#4B5563">（對照目標校系還缺什麼）</text>
<path d="M282,690.0 L436,707.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="672" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="703.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">畢業學分檢查</text>
<text x="685.0" y="729.0" font-size="15" text-anchor="middle" fill="#4B5563">（依入學年度的修業科目表，僅供參考）</text>
