<text x="685.0" y="359.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">貼上匯入學校資料</text>
<text x="685.0" y="385.0" font-size="15" text-anchor="middle" fill="#4B5563">（成績、獎懲、缺曠整段貼上；缺曠只有本人與班導看得到）</text>
<path d="M282,690.0 L436,449.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
