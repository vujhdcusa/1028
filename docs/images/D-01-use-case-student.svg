<text x="685.0" y="213.0" font-size="15" text-anchor="middle" fill="#4B5563">（首頁提示下一步；二技公告與老師的提醒）</text>
<path d="M282,690.0 L436,277.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
