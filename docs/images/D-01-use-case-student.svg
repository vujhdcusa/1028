<rect x="440" y="758" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="789.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">瀏覽學校資訊與下載表單</text>
<text x="685.0" y="815.0" font-size="15" text-anchor="middle" fill="#4B5563">（依主題、年級分類瀏覽；下載科辦表單）</text>
<path d="M282,690.0 L436,879.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="844" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="875.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">送審與查看老師註解</text>
<text x="685.0" y="901.0" font-size="15" text-anchor="middle" fill="#4B5563">（回覆註解、依建議修改後重新送審）</text>
<path d="M282,690.0 L436,965.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="930" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="961.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">怎麼操作</text>
<text x="685.0" y="987.0" font-size="15" text-anchor="middle" fill="#4B5563">（網頁導覽、常見問題、限定範圍的提問）</text>
