  <text x="800" y="167" class="n">上傳成績單、證照與其他資料</text><text x="800" y="292" class="n">系統擷取並建立可校正草稿</text><text x="800" y="417" class="n">學生校正、補充與確認</text>
  <polygon points="800,505 945,575 800,645 655,575" fill="#FFFFFF" class="box"/><text x="800" y="575" class="n">資料是否完整？</text>
