<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.note{font-size:16px;fill:#475569}.node{stroke:#334155;stroke-width:2}.label{font-size:20px;font-weight:600;text-anchor:middle;dominant-baseline:middle}.small{font-size:17px;font-weight:500;text-anchor:middle;dominant-baseline:middle}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="800" y="56" class="title" text-anchor="middle">D-10 期中核心：學習成果提交與輔導回饋流程圖</text>
  <text x="800" y="86" class="note" text-anchor="middle">AI 只提示佐證與缺件；教師保有輔導與人工確認權限</text>
  <rect x="105" y="390" width="185" height="70" rx="35" fill="#e0f2fe" class="node"/><text x="198" y="425" class="label">學生登入</text>
  <rect x="365" y="390" width="205" height="70" rx="14" fill="#dbeafe" class="node"/><text x="468" y="425" class="label">建立學習成果</text>
  <rect x="650" y="390" width="225" height="70" rx="14" fill="#dbeafe" class="node"/><text x="763" y="425" class="label">上傳檔案或連結</text>
  <rect x="945" y="390" width="225" height="70" rx="14" fill="#e0f2fe" class="node"/><text x="1058" y="425" class="label">保存要求快照</text>
  <rect x="1245" y="390" width="220" height="70" rx="14" fill="#ffedd5" class="node"/><text x="1355" y="425" class="label">AI 初步檢核</text>
  <path d="M290 425H365 M570 425H650 M875 425H945 M1170 425H1245" class="line"/>
  <rect x="1130" y="600" width="300" height="78" rx="14" fill="#dcfce7" class="node"/><text x="1280" y="628" class="label">教師查看成果與 AI 提示</text><text x="1280" y="654" class="small">留下輔導或補件建議</text>
  <path d="M1355 460V600" class="line"/>
  <polygon points="800,590 920,650 800,710 680,650" fill="#fef9c3" class="node"/><text x="800" y="650" class="label">需要補件？</text>
  <path d="M1130 639H920" class="line"/>
  <rect x="370" y="770" width="330" height="74" rx="14" fill="#dbeafe" class="node"/><text x="535" y="798" class="label">補件並提交新版本</text><text x="535" y="823" class="small">保留 V1、V2 與佐證歷程</text>
  <rect x="960" y="770" width="270" height="74" rx="14" fill="#e0f2fe" class="node"/><text x="1095" y="798" class="label">保存教師確認紀錄</text><text x="1095" y="823" class="small">完成本次成果整理</text>
  <path d="M720 684L535 770 M880 684L1095 770" class="line"/>
  <path d="M535 770V550H763V460" class="line"/>
</svg>
