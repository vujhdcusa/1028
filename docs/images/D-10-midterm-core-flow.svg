<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6B7280"/></marker><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#4B5563}.n{font-size:21px;font-weight:600;text-anchor:middle;dominant-baseline:middle}.s{font-size:17px;text-anchor:middle;dominant-baseline:middle}.box{stroke:#9CA3AF;stroke-width:1.5}.line{stroke:#6B7280;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="1480" fill="#FFFFFF"/><text x="800" y="56" class="title" text-anchor="middle">D-10 P0 檔案分析、檢核與文件產出流程圖</text><text x="800" y="88" class="sub" text-anchor="middle">學生確認資料；教師提供回饋；科辦／行政確認規則或結論</text>
