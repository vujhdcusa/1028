<text x="685.0" y="385.0" font-size="15" text-anchor="middle" fill="#4B5563">（年度課程規劃、修業科目表與證照規則）</text>
<path d="M282,475.0 L436,449.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="414" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="445.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">資料來源維護</text>
<text x="685.0" y="471.0" font-size="15" text-anchor="middle" fill="#4B5563">（來源失效標紅、換網址、停用、手動輸入）</text>
<path d="M282,475.0 L436,535.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="500" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="531.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">核對資料分類</text>
<text x="685.0" y="557.0" font-size="15" text-anchor="middle" fill="#4B5563">（AI 擬好主題、年級、類型，核對後才給學生看）</text>
<path d="M282,475.0 L436,621.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="586" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="617.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">操作紀錄查詢</text>
<text x="685.0" y="643.0" font-size="15" text-anchor="middle" fill="#4B5563">（查看重要操作與資料異動）</text>
<path d="M282,475.0 L436,707.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="672" width="490" height="70" rx="35.0" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
<text x="685.0" y="714.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">登出</text>
