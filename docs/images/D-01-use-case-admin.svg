<text x="685.0" y="127.0" font-size="15" text-anchor="middle" fill="#4B5563">（停用帳號、修改密碼（只有管理員）、匯入入學學年度、指派導師）</text>
<path d="M282,475.0 L436,191.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
