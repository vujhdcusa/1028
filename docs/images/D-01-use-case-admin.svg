<text x="685.0" y="299.0" font-size="15" text-anchor="middle" fill="#4B5563">（對照官方連結核對 AI 查到的資料，核准後發布二技公告）</text>
<path d="M282,475.0 L436,363.0" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
