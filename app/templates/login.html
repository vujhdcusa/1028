{% extends "base.html" %}
{% set page_name = "login" %}

{% block title %}登入｜資管科智慧學習歷程系統{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="surface" data-motion="reveal">
    <p class="eyebrow">Welcome back</p>
    <h1>回來把你的路，<br>再往前放一點。</h1>
    <p class="muted">登入後就能查看自己的學習路徑，或依帳號權限處理需要完成的工作。</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">帳號 <input name="username" autocomplete="username" required></label>
      <label class="field">密碼 <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">登入系統 <span aria-hidden="true">→</span></button>
    </form>
    <p><a href="{{ url_for('main.index') }}">← 回到系統介紹</a></p>
  </div>
</section>
{% endblock %}
